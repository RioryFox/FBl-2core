# /* ---- GF01WS-16 ---- */
# Hypridle policy:
# - auto-lock after 10 minutes idle
# - every logind lock event starts hyprlock and a 60-second DPMS-off timer
# - unlock always forces DPMS back on
# - no automatic suspend

$iDIR="$HOME/.config/swaync/images/ja.png"

general {
    lock_cmd = sh -c 'if ! pidof hyprlock >/dev/null; then hyprlock & fi; (sleep 60; pidof hyprlock >/dev/null && hyprctl dispatch dpms off) &'
    unlock_cmd = hyprctl dispatch dpms on
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 540
    on-timeout = notify-send -i $iDIR " You are idle!"
    on-resume = notify-send -i $iDIR " Oh! you're Back" " Hello !!!"
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# No automatic suspend.
